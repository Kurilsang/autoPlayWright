# 桌面客户端工作流「AI 编写」生成旅程探查（生成侧资产，自包含从启动态）：
# 进工作流 → 新建 → 开 AI 编写面板 → 真发一条需求，采集
# 提交 → 生成中 → 生成完成 各状态结构（消息/todo/脚本落盘/自动保存信号候选）。
# 产物入 .scratch/auto_playwright/snapshots/desktop/（gitignored，落盘自动脱敏）。
name: desktop-workflow-probe7
targets:
  - id: desktop-wf-ai-gen
    route: ""
    steps:
      - do: { page: probe, action: wait, args: { ms: 2000 } }
        label: boot_ready
      - do: { page: probe, action: click, args: { selector: { by: css, value: "div.integration-toast button[aria-label='关闭']" }, optional: true, timeout_ms: 2000 } }
        label: toast_dismissed
      - do: { page: probe, action: click, args: { selector: { by: css, value: "nav.sidebar-nav button.sidebar-nav-item:has(.sidebar-nav-label:text-is('工作流'))" }, timeout_ms: 5000 } }
        label: nav_workflow
      - do: { page: probe, action: wait, args: { ms: 1500 } }
        label: list_ready
        capture: true
      - do: { page: probe, action: click, args: { selector: { by: css, value: "button.btn-primary.wf-btn:text-is('新建工作流')" }, timeout_ms: 5000 } }
        label: new_dialog
      - do: { page: probe, action: type, args: { selector: { by: placeholder, value: "例如：周报汇总" }, text: "apw-ai-gen", timeout_ms: 5000 } }
        label: name_typed
      - do: { page: probe, action: click, args: { selector: { by: css, value: "div.integration-toast button[aria-label='关闭']" }, optional: true, timeout_ms: 2000 } }
        label: toast_dismissed_2
      - do: { page: probe, action: click, args: { selector: { by: css, value: "footer.wf-modal-footer button.btn-primary" }, timeout_ms: 5000 } }
        label: created
      - do: { page: probe, action: wait, args: { ms: 2000 } }
        label: detail_state
        capture: true
      # AI 编写面板（详情槽内 aside.wf-author）
      - do: { page: probe, action: click, args: { selector: { by: css, value: "div.wf-view-slot.is-active section.wf-detail-script button:text-is('AI 编写')" }, timeout_ms: 5000 } }
        label: ai_panel_open
      - do: { page: probe, action: wait, args: { ms: 1200 } }
        label: panel_state
        capture: true
      - do: { page: probe, action: dump_dom, args: { name: "wf7_panel" } }
        label: dom_panel
      - do: { page: probe, action: type, args: { selector: { by: css, value: "div.wf-view-slot.is-active textarea.wf-author-input" }, text: "生成一个最简工作流：分步打印 ai-alpha-alpha 并输出结果", timeout_ms: 5000 } }
        label: prompt_typed
        capture: true
      - do: { page: probe, action: click, args: { selector: { by: css, value: "div.wf-view-slot.is-active aside.wf-author button.btn-primary:text-is('发送')" }, timeout_ms: 5000 } }
        label: prompt_sent
      - do: { page: probe, action: wait, args: { ms: 3000 } }
        label: gen_t3
        capture: true
      - do: { page: probe, action: dump_dom, args: { name: "wf7_gen_t3" } }
        label: dom_gen_t3
      - do: { page: probe, action: wait, args: { ms: 17000 } }
        label: gen_t20
        capture: true
      - do: { page: probe, action: dump_dom, args: { name: "wf7_gen_t20" } }
        label: dom_gen_t20
      - do: { page: probe, action: wait, args: { ms: 40000 } }
        label: gen_t60
        capture: true
      - do: { page: probe, action: dump_dom, args: { name: "wf7_gen_t60" } }
        label: dom_gen_t60
      - do: { page: probe, action: wait, args: { ms: 60000 } }
        label: gen_t120
        capture: true
      - do: { page: probe, action: dump_dom, args: { name: "wf7_gen_t120" } }
        label: dom_gen_t120
      - do: { page: probe, action: wait, args: { ms: 120000 } }
        label: gen_t240
        capture: true
      - do: { page: probe, action: dump_dom, args: { name: "wf7_gen_t240" } }
        label: dom_gen_t240
    signals:
      - name: ai_toggle_active
        selector: { by: css, value: "section.wf-detail-script button.is-active:text-is('AI 编写')" }
      - name: author_empty
        selector: { by: text, value: 说明你的需求, exact: false }
      - name: author_input
        selector: { by: css, value: "textarea.wf-author-input" }
      - name: send_button
        selector: { by: text, value: 发送 }
      - name: stop_marker
        selector: { by: text, value: 停止, exact: false }
      - name: thinking_marker
        selector: { by: text, value: 思考, exact: false }
      - name: todo_marker
        selector: { by: css, value: "div.wf-author-todo li" }
      - name: prompt_echo
        selector: { by: text, value: ai-alpha-alpha, exact: false }
      - name: flow_node
        selector: { by: css, value: "section.wf-detail-flow span.wf-node-label" }
      - name: gen_done_hint
        selector: { by: text, value: 已保存, exact: false }
