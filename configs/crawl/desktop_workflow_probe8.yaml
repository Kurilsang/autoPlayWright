# 桌面客户端工作流「AI 编写」并行生成切换探查（生成侧资产）：
# 假设待验证：AI 生成是后台任务，view slot 切走/替换不中断（同运行语义）；
# 切回后各工作流的 AI 会话/生成态各归各（prompt 回显 + 对方标记零混入）。
# 产物入 .scratch/auto_playwright/snapshots/desktop/（gitignored，落盘自动脱敏）。
name: desktop-workflow-probe8
targets:
  - id: desktop-wf-ai-par
    route: ""
    steps:
      - do: { page: probe, action: click, args: { selector: { by: css, value: "div.integration-toast button[aria-label='关闭']" }, optional: true, timeout_ms: 2000 } }
        label: toast_dismissed
      # 弹回列表（optional 兼容槽深；超时给足——actionability 等待可能超 1.5s）
      - do: { page: probe, action: click, args: { selector: { by: css, value: "div.wf-view-slot.is-active button:text-is('← 返回')" }, optional: true, timeout_ms: 4000 } }
        label: back_1
      - do: { page: probe, action: click, args: { selector: { by: css, value: "div.wf-view-slot.is-active button:text-is('← 返回')" }, optional: true, timeout_ms: 4000 } }
        label: back_2
      - do: { page: probe, action: click, args: { selector: { by: css, value: "nav.sidebar-nav button.sidebar-nav-item:has(.sidebar-nav-label:text-is('工作流'))" }, timeout_ms: 5000 } }
        label: nav_workflow
      # ---- A：新建 → 开面板 → 发需求甲 ----
      - do: { page: probe, action: click, args: { selector: { by: css, value: "button.btn-primary.wf-btn:text-is('新建工作流')" }, timeout_ms: 5000 } }
        label: new_dialog_a
      - do: { page: probe, action: type, args: { selector: { by: placeholder, value: "例如：周报汇总" }, text: "apw-ai-par-a", timeout_ms: 5000 } }
        label: name_a_typed
      - do: { page: probe, action: click, args: { selector: { by: css, value: "footer.wf-modal-footer button.btn-primary" }, timeout_ms: 5000 } }
        label: created_a
      - do: { page: probe, action: wait, args: { ms: 2000 } }
        label: detail_a
      - do: { page: probe, action: click, args: { selector: { by: css, value: "div.wf-view-slot.is-active section.wf-detail-script button:text-is('AI 编写')" }, timeout_ms: 5000 } }
        label: ai_panel_a
      - do: { page: probe, action: type, args: { selector: { by: css, value: "div.wf-view-slot.is-active textarea.wf-author-input" }, text: "生成一个工作流：分步打印 ai-par-甲甲甲 并输出结果", timeout_ms: 5000 } }
        label: prompt_a_typed
      - do: { page: probe, action: click, args: { selector: { by: css, value: "div.wf-view-slot.is-active aside.wf-author button.btn-primary:text-is('发送')" }, timeout_ms: 5000 } }
        label: gen_a_started
      - do: { page: probe, action: wait, args: { ms: 2500 } }
        label: a_generating
        capture: true
      - do: { page: probe, action: dump_dom, args: { name: "wf8_a_generating" } }
        label: dom_a_generating
      # ---- 切走 A（详情槽将被 B 替换）→ 建 B 发需求乙 ----
      - do: { page: probe, action: click, args: { selector: { by: css, value: "div.wf-view-slot.is-active button:text-is('← 返回')" }, timeout_ms: 5000 } }
        label: back_a_to_list
      - do: { page: probe, action: click, args: { selector: { by: css, value: "button.btn-primary.wf-btn:text-is('新建工作流')" }, timeout_ms: 5000 } }
        label: new_dialog_b
      - do: { page: probe, action: type, args: { selector: { by: placeholder, value: "例如：周报汇总" }, text: "apw-ai-par-b", timeout_ms: 5000 } }
        label: name_b_typed
      - do: { page: probe, action: click, args: { selector: { by: css, value: "footer.wf-modal-footer button.btn-primary" }, timeout_ms: 5000 } }
        label: created_b
      - do: { page: probe, action: wait, args: { ms: 2000 } }
        label: detail_b
      - do: { page: probe, action: click, args: { selector: { by: css, value: "div.wf-view-slot.is-active section.wf-detail-script button:text-is('AI 编写')" }, timeout_ms: 5000 } }
        label: ai_panel_b
      - do: { page: probe, action: type, args: { selector: { by: css, value: "div.wf-view-slot.is-active textarea.wf-author-input" }, text: "生成一个工作流：分步打印 ai-par-乙乙乙 并输出结果", timeout_ms: 5000 } }
        label: prompt_b_typed
      - do: { page: probe, action: click, args: { selector: { by: css, value: "div.wf-view-slot.is-active aside.wf-author button.btn-primary:text-is('发送')" }, timeout_ms: 5000 } }
        label: gen_b_started
      - do: { page: probe, action: wait, args: { ms: 2500 } }
        label: b_generating
        capture: true
      - do: { page: probe, action: dump_dom, args: { name: "wf8_b_generating" } }
        label: dom_b_generating
      # ---- 切回 A：身份核对 + 生成态（后台在跑/已完成/被中断）----
      - do: { page: probe, action: click, args: { selector: { by: css, value: "div.wf-view-slot.is-active button:text-is('← 返回')" }, timeout_ms: 5000 } }
        label: back_b_to_list
      - do: { page: probe, action: click, args: { selector: { by: css, value: "li.wf-card:has(.wf-card-name:text-is('apw-ai-par-a')) button:text-is('打开')" }, timeout_ms: 5000 } }
        label: switch_to_a
      - do: { page: probe, action: wait, args: { ms: 1500 } }
        label: a_back_detail
        capture: true
      - do: { page: probe, action: click, args: { selector: { by: css, value: "div.wf-view-slot.is-active section.wf-detail-script button:text-is('AI 编写')" }, timeout_ms: 5000 } }
        label: ai_panel_a_back
      - do: { page: probe, action: wait, args: { ms: 1500 } }
        label: a_back_panel
        capture: true
      - do: { page: probe, action: dump_dom, args: { name: "wf8_a_back_panel" } }
        label: dom_a_back_panel
      - do: { page: probe, action: wait, args: { ms: 20000 } }
        label: a_settled
        capture: true
      - do: { page: probe, action: dump_dom, args: { name: "wf8_a_settled" } }
        label: dom_a_settled
      # ---- 切到 B：身份核对 + 生成态 ----
      - do: { page: probe, action: click, args: { selector: { by: css, value: "div.wf-view-slot.is-active button:text-is('← 返回')" }, timeout_ms: 5000 } }
        label: back_a_to_list_2
      - do: { page: probe, action: click, args: { selector: { by: css, value: "li.wf-card:has(.wf-card-name:text-is('apw-ai-par-b')) button:text-is('打开')" }, timeout_ms: 5000 } }
        label: switch_to_b
      - do: { page: probe, action: wait, args: { ms: 1500 } }
        label: b_back_detail
        capture: true
      - do: { page: probe, action: click, args: { selector: { by: css, value: "div.wf-view-slot.is-active section.wf-detail-script button:text-is('AI 编写')" }, timeout_ms: 5000 } }
        label: ai_panel_b_back
      - do: { page: probe, action: wait, args: { ms: 1500 } }
        label: b_back_panel
        capture: true
      - do: { page: probe, action: dump_dom, args: { name: "wf8_b_back_panel" } }
        label: dom_b_back_panel
    signals:
      - name: ai_stop_button
        selector: { by: css, value: "aside.wf-author button:text-is('停止')" }
      - name: ai_send_button
        selector: { by: css, value: "aside.wf-author button.btn-primary:text-is('发送')" }
      - name: echo_alpha
        selector: { by: text, value: ai-par-甲甲甲, exact: false }
      - name: echo_beta
        selector: { by: text, value: ai-par-乙乙乙, exact: false }
      - name: saved_notice
        selector: { by: css, value: "div.wf-notice.is-success" }
      - name: flow_node
        selector: { by: css, value: "section.wf-detail-flow span.wf-node-label" }
      - name: author_empty
        selector: { by: text, value: 说明你的需求, exact: false }
