# Aml Agent 会话页（真实环境）。由 AI 爬取页面结构生成（T07 预演），人工审核入库。
# 真实应用无 data-testid，候选优先使用稳定文案（placeholder/exact text）与结构类名。
page: aml_chat
locators:
  - name: new_chat_button
    source: ai
    candidates:
      - { by: text, value: 新建对话 }
  - name: message_input
    source: ai
    candidates:
      - { by: placeholder, value: "输入消息，按Enter发送，Shift+Enter换行" }
      - { by: css, value: "textarea" }
  - name: stop_button
    source: ai
    candidates:
      - { by: text, value: 停止 }
  - name: history_loading
    source: manual
    candidates:
      - { by: text, value: "加载对话历史中", exact: false }   # 会话区历史加载占位（加载中不可发送）
  - name: user_message
    source: ai
    candidates:
      - { by: css, value: "div.text-white.whitespace-pre-wrap" }
  - name: assistant_reply
    source: ai
    candidates:
      - { by: css, value: "div.markdown-prose" }
  # ---- 「选择 Agent 类型」弹窗（延迟弹出的全屏遮罩，需显式确认）----
  - name: agent_mode_dialog
    source: manual
    candidates:
      - { by: css, value: "div.fixed.inset-0:has(h2:text-is('选择 Agent 类型'))" }
  - name: agent_mode_expert
    source: manual
    candidates:
      - { by: css, value: "div.fixed.inset-0:has(h2:text-is('选择 Agent 类型')) button[aria-pressed]:has(h3:text-is('专家模式'))" }
  - name: agent_mode_quick
    source: manual
    candidates:
      - { by: css, value: "div.fixed.inset-0:has(h2:text-is('选择 Agent 类型')) button[aria-pressed]:has(h3:text-is('快速模式'))" }
  - name: agent_mode_engineer
    source: manual
    candidates:
      - { by: css, value: "div.fixed.inset-0:has(h2:text-is('选择 Agent 类型')) button[aria-pressed]:has(h3:text-is('工程模式'))" }
  - name: agent_mode_confirm
    source: manual
    candidates:
      - { by: css, value: "div.fixed.inset-0:has(h2:text-is('选择 Agent 类型')) button:text-is('确定')" }
  # ---- 完整回答的确定性结构标记（App 组件，不含 LLM 措辞）----
  - name: reasoning_steps
    source: manual
    candidates:
      - { by: text, value: "推理步骤", exact: false }   # 思考过程折叠卡：「推理步骤 · 共 N 步」
  - name: final_answer_card
    source: manual
    candidates:
      - { by: css, value: "h3:text-is('最终答案')" }     # 最终答案标识卡头（App 组件）
  - name: reply_actions
    source: manual
    candidates:
      - { by: text, value: "重新回答" }                   # 完成态操作行（复制/喜欢/重新回答）
