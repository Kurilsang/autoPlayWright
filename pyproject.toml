[project]
name = "apw"
version = "0.1.0"
description = "Agent 产品 UI 自动化测试框架：DSL 驱动、Web/Electron 双平台、AI 辅助生成"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "pytest>=8",
    "pydantic>=2.7",
    "PyYAML>=6",
    "allure-pytest>=2.13",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points.pytest11]
apw = "apw.pytest_plugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "web: 用例在 Web 端执行",
    "desktop: 用例在 Electron 客户端执行",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
